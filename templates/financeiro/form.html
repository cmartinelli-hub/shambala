{% extends "base.html" %}
{% block titulo %}Nova Movimentação Financeira{% endblock %}

{% block conteudo %}
<div class="cabecalho-secao">
    <h2>Nova Movimentação Financeira</h2>
    <a href="/financeiro" class="btn btn-secundario">← Voltar</a>
</div>

<div class="card-form">
    <form method="post">
        <div class="grade-form">
            <div class="campo">
                <label>Tipo *</label>
                <select name="tipo" required>
                    <option value="entrada">Entrada</option>
                    <option value="saida">Saída</option>
                </select>
            </div>
            <div class="campo">
                <label>Categoria *</label>
                <select name="categoria" required>
                    <option value="mensalidade">Mensalidade</option>
                    <option value="doacao">Doação</option>
                    <option value="livro">Livro/Material</option>
                    <option value="manutencao">Manutenção</option>
                    <option value="energia">Energia</option>
                    <option value="agua">Água</option>
                    <option value="aluguel">Aluguel</option>
                    <option value="alimentacao">Alimentação</option>
                    <option value="transporte">Transporte</option>
                    <option value="outros">Outros</option>
                </select>
            </div>
            <div class="campo">
                <label>Valor (R$) *</label>
                <input type="number" name="valor" step="0.01" min="0" value="0" required>
            </div>
            <div class="campo">
                <label>Data</label>
                <input type="date" name="data_movimentacao"
                       value="">
            </div>
            <div class="campo">
                <label>Status</label>
                <select name="status">
                    <option value="pago">Pago</option>
                    <option value="pendente">Pendente</option>
                </select>
            </div>
            <div class="campo">
                <label>Trabalhador</label>
                <div style="position:relative">
                    <input type="text" id="busca-trabalhador" placeholder="Buscar trabalhador…"
                           autocomplete="off"
                           style="width:100%;box-sizing:border-box">
                    <input type="hidden" name="trabalhador_id" id="trabalhador_id">
                    <div id="sug-trabalhador"
                         style="display:none;position:absolute;z-index:200;width:100%;
                                background:var(--cor-superficie);border:1px solid var(--cor-borda);
                                border-radius:var(--raio);box-shadow:var(--sombra);
                                max-height:200px;overflow-y:auto"></div>
                </div>
            </div>
            <div class="campo">
                <label>Pessoa</label>
                <div style="position:relative">
                    <input type="text" id="busca-pessoa" placeholder="Buscar pessoa…"
                           autocomplete="off"
                           style="width:100%;box-sizing:border-box">
                    <input type="hidden" name="pessoa_id" id="pessoa_id">
                    <div id="sug-pessoa"
                         style="display:none;position:absolute;z-index:200;width:100%;
                                background:var(--cor-superficie);border:1px solid var(--cor-borda);
                                border-radius:var(--raio);box-shadow:var(--sombra);
                                max-height:200px;overflow-y:auto"></div>
                </div>
            </div>
            <div class="campo campo-largo">
                <label>Descrição</label>
                <input type="text" name="descricao" placeholder="Detalhes da movimentação">
            </div>
            <div class="campo campo-largo" id="campo-pix" style="display:none">
                <label>PIX Copia e Cola</label>
                <input type="text" name="pix_copiadecola" placeholder="Código PIX">
            </div>
        </div>

        <div class="acoes-form">
            <button type="submit" class="btn btn-primario">Salvar</button>
            <a href="/financeiro" class="btn btn-secundario">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
    const tipoSelect = document.querySelector('select[name="tipo"]');
    const catSelect = document.querySelector('select[name="categoria"]');
    const campoPix = document.getElementById('campo-pix');

    catSelect.addEventListener('change', function() {
        const cat = this.value;
        const tipo = tipoSelect.value;
        campoPix.style.display = (cat === 'mensalidade' || cat === 'doacao' && tipo === 'entrada') ? '' : 'none';
    });

    const dateInput = document.querySelector('input[type="date"]');
    if (dateInput && !dateInput.value) {
        dateInput.value = new Date().toISOString().split('T')[0];
    }
})();

// Autocomplete de trabalhadores (filtro client-side)
(function() {
    const LISTA = {{ trabalhadores | tojson }};
    const input = document.getElementById('busca-trabalhador');
    const hidden = document.getElementById('trabalhador_id');
    const sug = document.getElementById('sug-trabalhador');

    function renderizar(itens) {
        if (!itens.length) { sug.style.display = 'none'; return; }
        sug.innerHTML = itens.map(t =>
            `<div data-id="${t.id}" data-nome="${t.nome_completo}"
                  style="padding:.45rem .7rem;font-size:.88rem;cursor:pointer"
                  onmouseover="this.style.background='var(--cor-fundo)'"
                  onmouseout="this.style.background=''">
                ${t.nome_completo}
             </div>`
        ).join('');
        sug.style.display = 'block';
    }

    input.addEventListener('input', () => {
        const q = input.value.trim().toLowerCase();
        hidden.value = '';
        if (!q) { sug.style.display = 'none'; return; }
        renderizar(LISTA.filter(t => t.nome_completo.toLowerCase().includes(q)));
    });

    sug.addEventListener('mousedown', (e) => {
        const item = e.target.closest('[data-id]');
        if (!item) return;
        input.value = item.dataset.nome;
        hidden.value = item.dataset.id;
        sug.style.display = 'none';
    });

    input.addEventListener('blur', () => setTimeout(() => { sug.style.display = 'none'; }, 150));
})();

// Autocomplete de pessoas (AJAX)
(function() {
    const input = document.getElementById('busca-pessoa');
    const hidden = document.getElementById('pessoa_id');
    const sug = document.getElementById('sug-pessoa');
    let timer = null;

    input.addEventListener('input', () => {
        clearTimeout(timer);
        hidden.value = '';
        const q = input.value.trim();
        if (q.length < 2) { sug.style.display = 'none'; return; }
        timer = setTimeout(async () => {
            const res = await fetch(`/cadastros/pessoas/buscar?nome=${encodeURIComponent(q)}&excluir=0`);
            const lista = await res.json();
            if (!lista.length) { sug.style.display = 'none'; return; }
            sug.innerHTML = lista.map(p =>
                `<div data-id="${p.id}" data-nome="${p.nome}"
                      style="padding:.45rem .7rem;font-size:.88rem;cursor:pointer"
                      onmouseover="this.style.background='var(--cor-fundo)'"
                      onmouseout="this.style.background=''">
                    ${p.nome}
                 </div>`
            ).join('');
            sug.style.display = 'block';
        }, 200);
    });

    sug.addEventListener('mousedown', (e) => {
        const item = e.target.closest('[data-id]');
        if (!item) return;
        input.value = item.dataset.nome;
        hidden.value = item.dataset.id;
        sug.style.display = 'none';
    });

    input.addEventListener('blur', () => setTimeout(() => { sug.style.display = 'none'; }, 150));
})();
</script>
{% endblock %}
