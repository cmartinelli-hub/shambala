{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if produto else 'Novo' }} Produto{% endblock %}

{% block conteudo %}
<div class="cabecalho-secao">
    <h2>{{ 'Editar' if produto else 'Novo' }} Produto</h2>
    <a href="/caixa/produtos" class="btn btn-secundario">← Voltar</a>
</div>

<div class="card-form">
    <form method="post" enctype="multipart/form-data">
        <!-- Foto compacta -->
        <div class="foto-compacta">
            <label class="foto-compacta-btn">
                {% if produto and produto.foto_produto %}
                <img src="{{ produto.foto_produto }}" class="foto-compacta-thumb" id="foto-preview">
                {% else %}
                <div class="foto-compacta-placeholder" id="foto-placeholder">📷</div>
                <img src="" class="foto-compacta-thumb" id="foto-preview" style="display:none">
                {% endif %}
                <input type="file" name="foto" accept="image/*" id="foto-input" style="display:none">
                <span class="foto-compacta-texto" id="foto-texto">
                    {{ 'Trocar foto' if produto and produto.foto_produto else 'Adicionar foto' }}
                </span>
            </label>
            {% if produto and produto.foto_produto %}
            <button type="button" class="foto-compacta-remover" id="btn-remover-foto" title="Remover foto">✕</button>
            {% endif %}
            <button type="button" class="foto-compacta-remover" id="btn-remover-foto-hidden"
                    style="display:none" title="Remover foto">✕</button>
        </div>
        <input type="hidden" name="remover_foto" id="remover-foto" value="">

        <div class="grade-form">
            <div class="campo campo-largo">
                <label>Nome *</label>
                <input type="text" name="nome" required autofocus
                       value="{{ produto.nome if produto else '' }}"
                       placeholder="Ex: Coxinha, Coca-Cola 350ml…">
            </div>

            <div class="campo">
                <label>Categoria *</label>
                <select name="categoria" required>
                    {% for val, label in categorias %}
                    <option value="{{ val }}"
                        {% if produto and produto.categoria == val %}selected{% endif %}>
                        {{ label }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="campo">
                <label>Código de Barras</label>
                <input type="text" name="codigo_barras" id="campo-barras"
                       value="{{ produto.codigo_barras if produto and produto.codigo_barras else '' }}"
                       placeholder="Leia ou digite o código"
                       style="font-family:monospace">
            </div>

            <div class="campo">
                <label>Preço de Custo (R$)</label>
                <input type="number" name="preco_custo" step="0.01" min="0"
                       value="{{ '%.2f'|format(produto.preco_custo) if produto else '0.00' }}">
            </div>

            <div class="campo">
                <label>Preço de Venda (R$) *</label>
                <input type="number" name="preco_venda" step="0.01" min="0" required
                       id="preco_venda"
                       value="{{ '%.2f'|format(produto.preco_venda) if produto else '0.00' }}">
            </div>

            <div class="campo">
                <label>Margem estimada</label>
                <div id="margem-display"
                     style="padding:.4rem .6rem;font-size:1rem;font-weight:700;color:#1da851">
                    —
                </div>
            </div>

            <div class="campo">
                <label>Atalho no PDV</label>
                <div style="display:flex;align-items:center;gap:.5rem;padding:.4rem 0">
                    <input type="checkbox" name="atalho" id="campo-atalho" value="1"
                           {% if produto and produto.atalho %}checked{% endif %}
                           style="width:1.2rem;height:1.2rem;accent-color:var(--cor-primaria)">
                    <label for="campo-atalho" style="font-size:.9rem;font-weight:400;margin:0">
                        Transformar em atalho (aparece no PDV)
                    </label>
                </div>
            </div>

            <div class="campo">
                <label>Situação</label>
                <select name="ativo">
                    <option value="1" {% if not produto or produto.ativo %}selected{% endif %}>Ativo</option>
                    <option value="0" {% if produto and not produto.ativo %}selected{% endif %}>Inativo</option>
                </select>
            </div>
        </div>

        <div class="acoes-form">
            <button type="submit" class="btn btn-primario">Salvar</button>
            <a href="/caixa/produtos" class="btn btn-secundario">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
    const custo  = document.querySelector('input[name="preco_custo"]');
    const venda  = document.getElementById('preco_venda');
    const margem = document.getElementById('margem-display');

    function calcMargem() {
        const c = parseFloat(custo.value) || 0;
        const v = parseFloat(venda.value) || 0;
        if (c <= 0) { margem.textContent = '—'; margem.style.color = '#999'; return; }
        const m = ((v - c) / c * 100);
        margem.textContent = m.toFixed(1) + '%';
        margem.style.color = m >= 0 ? '#1da851' : '#c0392b';
    }

    custo.addEventListener('input', calcMargem);
    venda.addEventListener('input', calcMargem);
    calcMargem();

    // Foco automático no campo de barras se vier de leitura
    document.getElementById('campo-barras').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); venda.focus(); }
    });

    // ── Preview de foto ─────────────────────────────────────────────────────
    const fotoInput = document.getElementById('foto-input');
    const fotoPreview = document.getElementById('foto-preview');
    const fotoPlaceholder = document.getElementById('foto-placeholder');
    const fotoTexto = document.getElementById('foto-texto');
    const btnRemover = document.getElementById('btn-remover-foto');
    const btnRemoverHidden = document.getElementById('btn-remover-foto-hidden');
    const removerFoto = document.getElementById('remover-foto');

    if (fotoInput) {
        fotoInput.addEventListener('change', () => {
            const file = fotoInput.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                fotoPreview.src = e.target.result;
                fotoPreview.style.display = '';
                if (fotoPlaceholder) fotoPlaceholder.style.display = 'none';
                fotoTexto.textContent = 'Trocar foto';
                if (btnRemoverHidden) btnRemoverHidden.style.display = '';
                if (btnRemover) btnRemover.style.display = 'none';
                removerFoto.value = '';
            };
            reader.readAsDataURL(file);
        });
    }

    const btnRemoverFoto = btnRemover || btnRemoverHidden;
    if (btnRemoverFoto) {
        btnRemoverFoto.addEventListener('click', () => {
            fotoPreview.src = '';
            fotoPreview.style.display = 'none';
            if (fotoPlaceholder) fotoPlaceholder.style.display = '';
            fotoTexto.textContent = 'Adicionar foto';
            removerFoto.value = '1';
            fotoInput.value = '';
            if (btnRemover) btnRemover.style.display = 'none';
            if (btnRemoverHidden) btnRemoverHidden.style.display = 'none';
        });
    }
})();
</script>
{% endblock %}
