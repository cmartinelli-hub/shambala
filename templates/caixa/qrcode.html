<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIX — Shambala</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: #0d2d5e;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #tela-aguarda {
            text-align: center;
            opacity: .35;
        }
        #tela-aguarda p {
            font-size: 1.8rem;
            margin-top: 1rem;
            letter-spacing: .1em;
        }
        #tela-pix {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            text-align: center;
        }
        #tela-pix .valor {
            font-size: 4rem;
            font-weight: 900;
            color: #fff;
        }
        #tela-pix .label-pix {
            font-size: 1.2rem;
            opacity: .7;
            letter-spacing: .15em;
            text-transform: uppercase;
        }
        #tela-pix img {
            width: min(60vw, 60vh);
            height: min(60vw, 60vh);
            border-radius: 12px;
            background: #fff;
            padding: 12px;
        }
        #tela-confirmado {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            text-align: center;
            animation: entrada .4s ease;
        }
        @keyframes entrada {
            from { transform: scale(.5); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }
        #tela-confirmado .icone { font-size: 8rem; }
        #tela-confirmado .msg   { font-size: 3rem; font-weight: 900; color: #2ecc71; }
    </style>
</head>
<body>
    <div id="tela-aguarda">
        <div style="font-size:6rem">📱</div>
        <p>Aguardando pagamento…</p>
    </div>

    <div id="tela-pix">
        <div class="label-pix">Pague via PIX</div>
        <div class="valor" id="qr-valor"></div>
        <img id="qr-img" src="" alt="QR Code PIX">
    </div>

    <div id="tela-confirmado">
        <div class="icone">✅</div>
        <div class="msg">Pagamento Confirmado!</div>
    </div>

    <script>
    (function() {
        const telaAguarda     = document.getElementById('tela-aguarda');
        const telaPix         = document.getElementById('tela-pix');
        const telaConfirmado  = document.getElementById('tela-confirmado');
        const qrImg           = document.getElementById('qr-img');
        const qrValor         = document.getElementById('qr-valor');

        function mostrar(tela) {
            [telaAguarda, telaPix, telaConfirmado].forEach(t => t.style.display = 'none');
            tela.style.display = 'flex';
        }

        function conectar() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            const ws = new WebSocket(`${proto}://${location.host}/caixa/ws`);

            ws.onmessage = (ev) => {
                const d = JSON.parse(ev.data);
                if (d.tipo === 'pix') {
                    qrImg.src = `data:image/png;base64,${d.qr_base64}`;
                    qrValor.textContent = `R$ ${parseFloat(d.valor).toFixed(2).replace('.', ',')}`;
                    mostrar(telaPix);
                } else if (d.tipo === 'confirmado') {
                    mostrar(telaConfirmado);
                    setTimeout(() => mostrar(telaAguarda), 4000);
                }
            };

            ws.onclose = () => setTimeout(conectar, 3000);
            ws.onerror = () => ws.close();
        }

        conectar();
    })();
    </script>
</body>
</html>
