<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Tabela de Preços — {{ centro_nome }}</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: Arial, sans-serif;
    color: #000;
    background: #fff;
    padding: 8mm 8mm 6mm;
}

.cabecalho {
    text-align: center;
    margin-bottom: 3mm;
    padding-bottom: 2mm;
    border-bottom: 2px solid #1a5fa8;
}
.cabecalho h1 {
    font-size: 16pt;
    font-weight: 700;
    letter-spacing: .02em;
    line-height: 1.2;
}
.cabecalho p {
    font-size: 10pt;
    color: #444;
    margin-top: 1mm;
}

table {
    width: 100%;
    border-collapse: collapse;
}
thead tr {
    background: #1a5fa8;
    color: #fff;
}
thead th {
    padding: 1.5mm 3mm;
    font-size: 12pt;
    font-weight: 700;
    text-align: left;
    line-height: 1.2;
}
thead th.preco {
    text-align: right;
    width: 38mm;
}
tbody tr:nth-child(even) {
    background: #eef3fb;
}
tbody td {
    padding: 1.2mm 3mm;
    font-size: 22pt;
    line-height: 1.15;
    border-bottom: 1px solid #ccd6ea;
    vertical-align: middle;
}
tbody td.preco {
    text-align: right;
    font-weight: 700;
    white-space: nowrap;
    color: #1a5fa8;
}

/* Botão visível apenas na tela */
.btn-imprimir {
    display: block;
    margin: 0 auto 5mm;
    padding: 7px 24px;
    background: #1a5fa8;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 11pt;
    font-weight: 700;
    cursor: pointer;
}
.btn-imprimir:hover { background: #154d8c; }

@media print {
    body { padding: 6mm 8mm; }
    .btn-imprimir { display: none; }
}
</style>
</head>
<body>

<button class="btn-imprimir" onclick="window.print()">🖨️ Imprimir</button>

<table>
    <thead>
        <tr>
            <th>Produto</th>
            <th class="preco">Preço</th>
        </tr>
    </thead>
    <tbody>
    {% for p in produtos %}
    <tr>
        <td>{{ p.nome }}</td>
        <td class="preco">R$ {{ "%.2f"|format(p.preco_venda)|replace(".", ",") }}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>

</body>
</html>
