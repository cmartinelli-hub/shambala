{# Cartão da carteirinha — usado pela individual e pelo lote, para que nome e
   código nunca se misturem entre cartões. três faixas: estrela+nome, QR, nome+código. #}
{% macro cartao(c, centro) -%}
<div class="cartao" data-trabalhador="{{ c.id }}" data-codigo="{{ c.codigo }}">
    <div class="cc-topo">
        <img class="cc-estrela"
             src="{{ '/static/logos/' ~ centro.centro_logo if centro.centro_logo else '/static/logos/estrela_dourada.svg' }}"
             alt="">
        <span class="cc-centro">Shambala – Cidade de Luz</span>
    </div>
    <div class="cc-qr-faixa">
        <img class="cc-qr" src="{{ c.qr }}" alt="QR {{ c.codigo }}">
    </div>
    <div class="cc-rodape">
        {% set n = c.nome|length %}
        <div class="cc-nome {% if n > 40 %}longo{% elif n > 24 %}medio{% endif %}">{{ c.nome }}</div>
        <div class="cc-codigo">{{ c.codigo }}</div>
    </div>
</div>
{%- endmacro %}
